<div
  class="flex items-center justify-between gap-3 rounded border border-slate-200 bg-white px-4 py-3"
>
  <div class="flex flex-col">
    <span class="text-sm font-medium text-slate-700">{{ label }}</span>
    @if (detail) {
      <span class="text-xs text-slate-400">{{ detail }}</span>
    }
  </div>
  <div class="flex items-center gap-2">
    <span class="inline-block h-2.5 w-2.5 rounded-full" [ngClass]="dotClass" aria-hidden="true"></span>
    <span class="text-sm font-semibold text-slate-600">{{ statusText }}</span>
  </div>
</div>
