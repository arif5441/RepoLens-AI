<section class="mx-auto max-w-3xl px-6 py-8">
  <h1 class="mb-1 text-xl font-semibold text-slate-800">System Status</h1>
  <p class="mb-6 text-sm text-slate-500">
    Foundation health check for the API, database, and local LLM runtime.
  </p>

  @if (loading) {
    <div class="rounded border border-slate-200 bg-white px-4 py-6 text-sm text-slate-400">
      Checking system status…
    </div>
  } @else if (loadError) {
    <div class="rounded border border-red-200 bg-red-50 px-4 py-4 text-sm text-red-700">
      Could not reach the RepoLens API. Is the backend running on the configured URL?
    </div>
  } @else if (health) {
    <div class="flex flex-col gap-3">
      <app-status-indicator label="API" [status]="health.api.status" [detail]="health.api.detail" />
      <app-status-indicator
        label="Database"
        [status]="health.database.status"
        [detail]="health.database.detail"
      />
      <app-status-indicator
        label="Ollama"
        [status]="health.ollama.status"
        [detail]="health.ollama.detail"
      />
    </div>
  } @else {
    <div class="rounded border border-slate-200 bg-white px-4 py-6 text-sm text-slate-400">
      No status data available.
    </div>
  }
</section>
